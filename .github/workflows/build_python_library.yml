name: Build Python Libraries

on:
  push:
  pull_request:

jobs:
  build-python:
    name: Build Python Library
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26-intel, macos-26]
        python-version: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy

      - name: Install package
        run: pip install -e .

      - name: Inspect native extension (macOS)
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import glob
          import sysconfig

          print("platform:", sysconfig.get_platform())
          for path in sorted(glob.glob("src/fcwt/*")):
              print(path)
          PY
          if ls src/fcwt/_fcwt*.so >/dev/null 2>&1; then
            otool -L src/fcwt/_fcwt*.so
          fi

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest tests/test_fcwt.py -v

      - name: Upload Python build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-build-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            build/
            src/
          retention-days: 3
